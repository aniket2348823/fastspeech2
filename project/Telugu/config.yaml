# Telugu FastSpeech2 - dataset, preprocessing, training and inference settings.
#
# Modifications relative to the English config (documented in the report):
#   * text.cleaner: []            -> no phoneme cleaner; Telugu is modelled at the
#                                    grapheme level (U+0C00..U+0C7F clusters)
#   * common/telugu.py            -> grapheme segmentation, romanisation, numbers
#   * common/patch_repo.py        -> appends "@<grapheme>" entries to text/symbols.py
#   * common/align.py             -> MMS_FA (no Telugu MFA model exists)
#   * vocoder.speaker: universal  -> the multi-speaker HiFi-GAN, not the English one

language: Telugu
dataset:
  name: IndicTTS_Telugu
  audio_dir: data/Telugu/audio
  metadata_csv: data/Telugu/metadata.csv
  columns: { text: text, path: file, speaker: speaker }

split:
  train_hours: 5.0
  val_hours: 1.0
  train_ratio: 0.8      # used when total data < train_hours + val_hours
  seed: 1234
  min_sec: 0.4
  max_sec: 20.0

text:
  cleaner: []                # graphemes are already the model units
  language: te

audio:
  sampling_rate: 22050
  hop_length: 256
  win_length: 1024
  fft_size: 1024
  n_mel_channels: 80
  mel_fmin: 0
  mel_fmax: 8000

pitch:
  feature: phoneme_level     # "phoneme" == grapheme here
  normalization: true
energy:
  feature: phoneme_level
  normalization: true

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 4
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor_filter_size: 256
  variance_predictor_kernel_size: 3
  variance_predictor_dropout: 0.5
  n_bins: 256
  max_seq_len: 1000
  multi_speaker: false       # IndicTTS Telugu has one male + one female voice

train:
  batch_size: 16
  grad_accum_step: 2
  # 40k micro-steps x 16 utts = 640k samples over the 5 h Telugu train split
  # (~5 h on 2xT4). save_every 2000 keeps a session kill cheap to recover.
  max_steps: 40000
  warm_up_step: 4000
  anneal_steps: [1000000, 2000000]
  anneal_rate: 0.3
  log_every: 100
  val_every: 2000
  save_every: 2000

vocoder:
  speaker: universal         # HiFi-GAN trained on many speakers/languages

inference:
  restore_step: 0            # 0 -> latest checkpoint
  # Verbatim from the assignment PDF.  T2b/T4 are stored un-hyphenated (the PDF
  # wraps them across lines); T3 keeps its double space on purpose.
  sentences:
    - { id: T1,  text: "న్యూరోఫార్మకోలాజికల్ పరిశోధనలో నూతన ఔషధాల ప్రభావాన్ని విశ్లేషించారు." }
    - { id: T2a, text: "తాడుపై అతని పట్టు చాలా బలంగా ఉంది." }
    - { id: T2b, text: "ఆమె పట్టు చీరను ధరించి వేడుకకు వచ్చింది." }
    - { id: T3,  text: "పులి అడ  విలో నిశ్శబ్దంగా నడిచింది." }
    - { id: T4,  text: "ఈ సమావేశం 2026 నవంబర్ 12వ తేదీ ఉదయం 10:45 గంటలకు ప్రారంభమవుతుంది, సమయానికి సిద్ధంగా ఉంచండి." }
